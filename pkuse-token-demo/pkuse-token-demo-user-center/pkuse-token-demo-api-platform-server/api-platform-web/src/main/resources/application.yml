# ===================================================================
#  api-platform：模式三对接（跨域 + 跨 Redis，client3 的第二实例）
#    跨域    ：部署在 127.0.0.1（与认证中心 localhost 不同域），Cookie 不共享
#    跨 Redis：使用自己的 Redis（db7，独立于认证中心 db5 与客户端3 db6）
#              —— ticket 通过 HTTP 接口向认证中心校验（is-http=true）
# ===================================================================
server:
  port: 9005

spring:
  application:
    name: pkuse-token-demo-api-platform-server

  # 业务数据库：magic-api 资源库（s_api_manage）+ 开放调用方表（s_open_client）
  # KingbaseES，与用户中心 server 同款（可按需替换数据库与驱动）；首次启动前请执行 db/init-api-platform.sql
  datasource:
    driver-class-name: com.kingbase8.Driver
    url: jdbc:kingbase8://192.168.1.77:54321/PKUSE_TOKEN_USER_CENTER
    username: DEV_USER_CENTER
    password: Beid@s0ft

    # Druid 连接池参数
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 8
      max-wait: 6000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  # 模式三：本应用自己的 Redis（与认证中心、client3 都不是同一个库）
  data:
    redis:
      database: 7
      host: 192.168.1.75
      port: 6379
      password: bds0ft@2025
      timeout: 10s

# ORM：MyBatis-Plus（驼峰映射默认开启；主键为 32 位 UUID，由应用生成）
mybatis-plus:
  global-config:
    banner: false

sa-token:
  # 打印操作日志
  is-log: true

  # 开放接口令牌（/open/token）签发的会话 loginId 形如 open:{client}，必须允许冒号
  allow-login-id-colon: true

  # 独立 token 名（同域单端口部署适配，参考授权中心的 authcenter-token）：
  # token-name 同时是 Cookie 名、请求参数名、Redis key 前缀。本平台会话在独立 Redis（db7），
  # 若沿用默认 satoken，SSO 登录写下的 Cookie 会覆盖门户（用户中心，db5）的同名 Cookie，
  # 导致门户登录态丢失；独立命名后 Cookie/请求头/key 前缀互不冲突。
  # 前端（api-platform-vue3 的 api.js）请求头与注销参数名已同步使用 api-platform-token；
  # 开放接口（/open/token 换取的令牌）调用方也需以 api-platform-token 请求头携带。
  token-name: api-platform-token

  # SSO-Client 配置
  sso-client:
    # 应用标识（需与用户中心「应用管理」中的登记一致）
    client: sso-client5
    # SSO-Server 端（认证中心）主机地址
    server-url: http://localhost:9000
    # API 接口调用秘钥（参数签名/消息推送校验使用，与认证中心登记一致）
    secret-key: SSO-C5-kQwIOrYvnXmSDkwEiFngrKidMcdrgKor
    # 模式三：使用 HTTP 请求向认证中心校验 ticket
    is-http: true

# 快速接口开发平台
magic-api:
  # 编辑器 Web UI 地址（context-path 下完整路径：/api-platform/console）
  web: /console
  # 编辑器独立登录的内置账号（与认证中心登录完全无关）
  security:
    username: admin
    password: Beid@s0ft.com
  resource:
    type: database
    table-name: s_api_manage
  task:
    enable: true
    pool:
      size: 8

# ==================== magic-api 接口鉴权（Pkuse-Token，见 config/magic 包） ====================
magic-auth:
  # 鉴权总开关：false 时所有 magic 接口匿名放行（仅本地调试用）
  enabled: true
  # 匿名放行的 magic 接口（Ant 通配，匹配完整请求路径），例如：
  #   - /test/**
  anonymous-paths: []
  # 编辑器鉴权方式（编辑器登录完全独立于认证中心）：
  #   builtin     —— magic-api 内置静态账号（上方 magic-api.security 配置，当前使用）
  #   pkuse-token —— 编辑器登录框输入认证中心账号密码（后端委托认证中心校验，见 PkuseTokenAuthorizationInterceptor）
  editor-auth: builtin

# 开放接口调用方已由静态配置（magic-open.clients）提取为动态管理模块：
#   存储：数据库表 s_open_client（Druid + MyBatis-Plus，见 api-platform-service 的 magic 域）
#   管理：GET/POST/PUT/DELETE /open/clients（需 pkuse-token 登录；启禁用/重置密钥/删除即时生效并吊销令牌）
#   签发：POST /open/token 按表内登记的 client/secret 实时校验签名
# 种子数据见 db/init-api-platform.sql
# ==================== 授权中心客户端（V2：接口级 RBAC）====================
# magic 接口经 /magic/perms 绑定权限码后，拦截器按登录用户校验（StpInterface 由 starter 自动适配，
# 权限数据从授权中心拉取并按 loginId 缓存 60s；授权中心故障 30 分钟内沿用陈旧数据）。
# 注意：open:{client} 开放调用方不是用户中心用户，无权限码 → 绑定了权限码的接口对其返回 403（按设计）。
auth-center:
  client:
    base-url: http://localhost:9010
    client: sso-client5
    secret-key: SSO-C5-kQwIOrYvnXmSDkwEiFngrKidMcdrgKor
    cache-ttl-seconds: 60
    max-stale-seconds: 1800
    expose-endpoints: false
