# ===================================================================
#  client2：模式二对接（跨域 + 同 Redis）
#    跨域    ：部署在 127.0.0.1（与认证中心 localhost 不同域），Cookie 不共享
#    同 Redis：与认证中心使用同一个 Redis（同一 db）
#              —— ticket 直连 Redis 校验（is-http=false，默认）
# ===================================================================
server:
  port: 9002

spring:
  application:
    name: pkuse-token-demo-user-center-client2

sa-token:
  # 打印操作日志
  is-log: true

  # SSO-Client 配置
  sso-client:
    # 应用标识（需与用户中心「应用管理」中的登记一致）
    client: sso-client2
    # SSO-Server 端（认证中心）主机地址
    server-url: http://localhost:8091
    # API 接口调用秘钥（参数签名/消息推送校验使用，与认证中心登记一致）
    secret-key: SSO-C2-kQwIOrYvnXmSDkwEiFngrKidMcdrgKor
    # 模式二：跨域 + 同 Redis，ticket 直连 Redis 校验（保持默认 false 即可）
    is-http: false

  # 模式一/二：与认证中心使用同一个 Redis（此处需与认证中心配置一致）
  # 注：使用 alone-redisson 需要在 pom.xml 引入 pkuse-token-alone-redisson 依赖
  alone-redisson:
    config: |
      singleServerConfig:
        address: "redis://192.168.1.75:6379"
        password: "bds0ft@2025"
        database: 5
