# ===================================================================
#  生产环境配置（打包：mvn package -P prod）
#  TODO：部署前将数据源 / Redis / 各地址修改为生产环境实际值；
#        建议口令等敏感项由运维通过启动参数或配置中心注入，避免明文留档
# ===================================================================
server:
  port: 8091

spring:
  # ------------------- 数据源：人大金仓 KingbaseES（p6spy 代理，部门标准强制） -------------------
  # 驱动为 p6spy 代理驱动（真实驱动 com.kingbase8.Driver 由 spy.properties 的 driverlist 提供）；
  # url 使用 jdbc:p6spy: 前缀，实际执行 SQL 经 p6spy 打印到 Log4j2（logger=p6spy）并做慢 SQL 检测
  datasource:
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:kingbase8://TODO_PROD_DB_HOST:54321/PKUSE_TOKEN_USER_CENTER
    username: TODO_PROD_DB_USER
    password: TODO_PROD_DB_PASSWORD

  # ------------------- Redis：存放 token 会话（各接入应用共享） -------------------
  data:
    redis:
      database: 5
      host: TODO_PROD_REDIS_HOST
      port: 6379
      password: TODO_PROD_REDIS_PASSWORD
      timeout: 10s
    lettuce:
      pool:
        max-active: 200
        max-wait: -1ms
        max-idle: 10
        min-idle: 0

# ------------------- MyBatis-Plus -------------------
# SQL 日志已由 p6spy 统一接管（数据源 jdbc:p6spy: 前缀 + spy.properties），不再配置 mybatis log-impl

# ------------------- SSO-Server 环境项 -------------------
sa-token:
  sso-server:
    # 主页路由：访问 /sso/auth 未指定 redirect 参数时跳转的地址（指向生产环境工作台）
    home-route: https://TODO_PROD_FRONTEND_HOST/workbench
    # 生产环境必须开启 SSO 参数签名校验，并保证应用侧密钥与「应用管理」中一致
    is-check-sign: true

# ------------------- 用户中心自定义配置 -------------------
user-center:
  # 前端（统一登录页）地址：未登录访问 /sso/auth 时跳转到这里
  frontend-base-url: https://TODO_PROD_FRONTEND_HOST

  # 登录安全：部署级参数（管理员登录后在「规则配置」中不暴露的项）
  login:
    max-devices: 1
    device-lock-exempt-admin: false
    device-verify-minutes: 5
    device-verify-token-minutes: 5
    # 生产环境必须为 false：验证码不得随响应返回（真实短信通道下发）
    device-verify-show-code: false
