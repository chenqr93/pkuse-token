# ===================================================================
#  测试环境配置（打包：mvn package -P test）
#  TODO：部署前将数据源 / Redis / 各地址修改为测试环境实际值
# ===================================================================
server:
  port: 9000

spring:
  # ------------------- 数据源：人大金仓 KingbaseES（p6spy 代理，部门标准强制） -------------------
  # 驱动为 p6spy 代理驱动（真实驱动 com.kingbase8.Driver 由 spy.properties 的 driverlist 提供）；
  # url 使用 jdbc:p6spy: 前缀，实际执行 SQL 经 p6spy 打印到 Log4j2（logger=p6spy）并做慢 SQL 检测
  datasource:
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:kingbase8://TODO_TEST_DB_HOST:54321/PKUSE_TOKEN_USER_CENTER
    username: TODO_TEST_DB_USER
    password: TODO_TEST_DB_PASSWORD

  # ------------------- Redis：存放 token 会话（各接入应用共享） -------------------
  data:
    redis:
      database: 5
      host: TODO_TEST_REDIS_HOST
      port: 6379
      password: TODO_TEST_REDIS_PASSWORD
      timeout: 10s
    lettuce:
      pool:
        max-active: 200
        max-wait: -1ms
        max-idle: 10
        min-idle: 0

# ------------------- MyBatis-Plus -------------------
# SQL 日志已由 p6spy 统一接管（数据源 jdbc:p6spy: 前缀 + spy.properties），不再配置 mybatis log-impl

# ------------------- SSO-Server 环境项 -------------------
sa-token:
  sso-server:
    # 主页路由：访问 /sso/auth 未指定 redirect 参数时跳转的地址（指向测试环境工作台）
    home-route: http://TODO_TEST_FRONTEND_HOST:5173/workbench
    # 测试环境：与开发联调阶段可保持 false（生产环境必须为 true）
    is-check-sign: false

# ------------------- 用户中心自定义配置 -------------------
user-center:
  # 前端（统一登录页）地址：未登录访问 /sso/auth 时跳转到这里
  frontend-base-url: http://TODO_TEST_FRONTEND_HOST:5173

  # 登录安全：部署级参数（管理员登录后在「规则配置」中不暴露的项）
  login:
    max-devices: 1
    device-lock-exempt-admin: false
    device-verify-minutes: 5
    device-verify-token-minutes: 5
    # 测试环境可开启便于联调（生产环境必须为 false）
    device-verify-show-code: true
