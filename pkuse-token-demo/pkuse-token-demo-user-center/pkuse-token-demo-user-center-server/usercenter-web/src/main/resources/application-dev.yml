# ===================================================================
#  开发环境配置（默认打包环境：mvn package 或 mvn package -P dev）
# ===================================================================
server:
  port: 9000

spring:
  # ------------------- 数据源：人大金仓 KingbaseES（p6spy 代理，部门标准强制） -------------------
  # 驱动为 p6spy 代理驱动（真实驱动 com.kingbase8.Driver 由 spy.properties 的 driverlist 提供）；
  # url 使用 jdbc:p6spy: 前缀，实际执行 SQL 经 p6spy 打印到 Log4j2（logger=p6spy）并做慢 SQL 检测
  datasource:
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:kingbase8://192.168.1.77:54321/PKUSE_TOKEN_USER_CENTER
    username: DEV_USER_CENTER
    password: Beid@s0ft

  # ------------------- Redis：存放 token 会话（各接入应用共享） -------------------
  data:
    redis:
      database: 5
      host: 192.168.1.75
      port: 6379
      password: bds0ft@2025
      timeout: 10s
    lettuce:
      pool:
        max-active: 200
        max-wait: -1ms
        max-idle: 10
        min-idle: 0

# ------------------- MyBatis-Plus -------------------
# SQL 日志已由 p6spy 统一接管（数据源 jdbc:p6spy: 前缀 + spy.properties），不再配置 mybatis log-impl

# ------------------- SSO-Server 环境项 -------------------
sa-token:
  sso-server:
    # 主页路由：访问 /sso/auth 未指定 redirect 参数时跳转的地址（这里指向前端工作台）
    home-route: http://localhost:8090/workbench
    # 演示环境：跳过 SSO 参数签名校验（生产环境必须为 true）
    is-check-sign: false

# ------------------- 用户中心自定义配置 -------------------
user-center:
  # 前端（统一登录页）地址：未登录访问 /sso/auth 时跳转到这里
  frontend-base-url: http://localhost:8090

  # 登录安全：部署级参数（管理员登录后在「规则配置」中不暴露的项）
  login:
    # 允许绑定的设备数量上限
    max-devices: 1
    # 内置管理员账号是否豁免设备锁（避免运维被锁在门外）
    device-lock-exempt-admin: false
    # 新设备验证码 / 验证凭证有效期（分钟）
    device-verify-minutes: 5
    device-verify-token-minutes: 5
    # 演示模式：新设备验证码不真实发送短信，改为在响应中返回（生产环境必须为 false）
    device-verify-show-code: true
