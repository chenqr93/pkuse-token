# ===================================================================
#  p6spy SQL 监控配置（部门 Java Web 开发标准强制项，要求 p6spy >= 1.9.0，当前 3.9.1）
#
#  数据源接入（application-{env}.yml）：
#    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
#    url: jdbc:p6spy:kingbase8://host:port/db
#  真实驱动由下方 driverlist 提供；SQL 日志经 Slf4JLogger 输出到 Log4j2（logger 名为 p6spy）
# ===================================================================

# 真实 JDBC 驱动（KingbaseES，兼容 PostgreSQL 方言）
driverlist=com.kingbase8.Driver

# SQL 日志格式：自定义单行（当前时间 | 执行耗时 | 类别 | 填充参数后的 SQL）
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=%(currentTime) | %(executionTime) ms | %(category) | connection %(connectionId) | %(sqlSingleLine)
dateformat=yyyy-MM-dd HH:mm:ss.SSS

# 通过 SLF4J 输出（后端为 Log4j2，logger 名 p6spy，见 log4j2-spring.xml）
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# 慢 SQL 检测：单条语句执行超过 3000ms 输出 outage 告警（包含执行中与已完成的慢语句）
outagedetection=true
outagedetectioninterval=3000

# 按需排除无需监控的表（示例）：
# excludecategories=info,debug,result,batch
