# ===================================================================
#  client3：模式三对接（跨域 + 跨 Redis）
#    跨域    ：部署在 127.0.0.1（与认证中心 localhost 不同域），Cookie 不共享
#    跨 Redis：使用自己的 Redis（与认证中心不同实例/库）
#              —— ticket 通过 HTTP 接口向认证中心校验（is-http=true）
# ===================================================================
server:
  port: 9003

spring:
  application:
    name: pkuse-token-demo-user-center-client3

  # 模式三：本应用自己的 Redis（与认证中心不是同一个）
  data:
    redis:
      database: 6
      host: 192.168.1.75
      port: 6379
      password: bds0ft@2025
      timeout: 10s

sa-token:
  # 打印操作日志
  is-log: true

  # SSO-Client 配置
  sso-client:
    # 应用标识（需与用户中心「应用管理」中的登记一致）
    client: sso-client3
    # SSO-Server 端（认证中心）主机地址
    server-url: http://localhost:9000
    # API 接口调用秘钥（参数签名/消息推送校验使用，与认证中心登记一致）
    secret-key: SSO-C3-kQwIOrYvnXmSDkwEiFngrKidMcdrgKor
    # 模式三：使用 HTTP 请求向认证中心校验 ticket
    is-http: true
